<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Screen Rekaman Suara - Ritun</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "ios-bg": "#F2F2F7",
          "ios-card": "#FFFFFF",
          "ios-blue": "#007AFF",
          "ios-red": "#FF3B30",
          "ios-gray": "#8E8E93",
          "ios-gray-light": "#E5E5EA",
          "ios-separator": "#C6C6C8",
          "primary": "#0058bc",
          "surface": "#faf9fe",
          "on-surface": "#1a1b1f"
        },
        "fontFamily": {
          "body": ["-apple-system", "BlinkMacSystemFont", "'SF Pro Text'", "system-ui", "sans-serif"],
          "display": ["-apple-system", "BlinkMacSystemFont", "'SF Pro Display'", "system-ui", "sans-serif"],
          "arabic": ["'Amiri'", "'Traditional Arabic'", "serif"]
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  body {
    background-color: #F2F2F7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: max(884px, 100dvh);
  }
  .voice-memo-bar {
    width: 3.5px;
    border-radius: 9999px;
    background-color: #FF3B30;
    transition: height 0.15s ease;
  }
</style>
</head>
<body class="text-[#1C1C1E] min-h-screen flex flex-col items-center justify-between">
<div class="w-full max-w-md min-h-screen flex flex-col justify-between px-5 pt-12 pb-8">
<!-- Header / Top Bar (iOS Style) -->
<header class="flex justify-between items-center w-full relative h-11">
<button class="text-[#007AFF] text-[17px] font-normal tracking-tight active:opacity-60 transition-opacity flex items-center gap-1">
      Batal
    </button>
<!-- Clean Brand 'R' Logo (no white background box) -->
<div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center">
<div class="w-8 h-8 rounded-full flex items-center justify-center">
<svg class="w-7 h-7" fill="none" viewbox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
<circle cx="18" cy="18" fill="#16A34A" fill-opacity="0.12" r="18"></circle>
<path d="M12 26V10H19C21.7614 10 24 12.2386 24 15C24 17.4335 22.2618 19.4608 19.9575 19.897L24.5 26H20L16 20H15V26H12ZM15 17H19C20.1046 17 21 16.1046 21 15C21 13.8954 20.1046 13 19 13H15V17Z" fill="#16A34A"></path>
</svg>
</div>
</div>
<!-- Monospace Audio Timer Badge -->
<div class="flex items-center gap-1.5 bg-black/5 px-2.5 py-1 rounded-full border border-black/5">
<span class="w-2 h-2 rounded-full bg-[#FF3B30] animate-pulse"></span>
<span class="font-mono text-[14px] font-semibold tracking-tight text-[#1C1C1E] tabular-nums">00:03</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-between py-6 w-full">
<!-- Title & Quran Verse Card -->
<div class="w-full text-center space-y-4">
<h1 class="text-[17px] font-semibold text-[#8E8E93] uppercase tracking-wider text-xs">
        Bacakan Ayat Ini
      </h1>
<!-- Clean Apple Card for Verse -->
<div class="bg-white rounded-2xl p-6 shadow-sm border border-[#E5E5EA] w-full text-center space-y-5">
<p class="font-arabic text-[30px] leading-[62px] text-[#1C1C1E] font-normal tracking-wide" dir="rtl">
          إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ
        </p>
<div class="h-[0.5px] w-full bg-[#E5E5EA]"></div>
<p class="text-[15px] leading-[22px] text-[#636366] font-normal italic">
          "Hanya Engkaulah yang kami sembah, dan hanya kepada Engkaulah kami meminta pertolongan."
        </p>
</div>
</div>
<!-- Recording Section (Apple Voice Memos Aesthetic) -->
<div class="flex flex-col items-center justify-center my-auto w-full py-4 space-y-7">
<!-- Voice Memos Waveform Canvas Area -->
<div class="w-full bg-white rounded-2xl p-5 border border-[#E5E5EA] shadow-sm flex flex-col items-center justify-center space-y-3">
<div class="flex items-center justify-center gap-[4.5px] h-16 w-full overflow-hidden">
<span class="voice-memo-bar h-2 opacity-40"></span>
<span class="voice-memo-bar h-4 opacity-50"></span>
<span class="voice-memo-bar h-6 opacity-60"></span>
<span class="voice-memo-bar h-3 opacity-60"></span>
<span class="voice-memo-bar h-8 opacity-75"></span>
<span class="voice-memo-bar h-12 opacity-90"></span>
<span class="voice-memo-bar h-14"></span>
<span class="voice-memo-bar h-10"></span>
<span class="voice-memo-bar h-16"></span>
<span class="voice-memo-bar h-12"></span>
<span class="voice-memo-bar h-8 opacity-90"></span>
<span class="voice-memo-bar h-14"></span>
<span class="voice-memo-bar h-11"></span>
<span class="voice-memo-bar h-5 opacity-70"></span>
<span class="voice-memo-bar h-8 opacity-75"></span>
<span class="voice-memo-bar h-4 opacity-50"></span>
<span class="voice-memo-bar h-2 opacity-30"></span>
</div>
<div class="flex items-center gap-1.5 text-xs font-medium text-[#8E8E93]">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-[#FF3B30]"></span>
<span>Sedang mendengarkan ucapan Anda...</span>
</div>
</div>
<!-- Apple Voice Memos Stop/Record Button -->
<div class="flex flex-col items-center justify-center pt-2">
<button class="relative w-[78px] h-[78px] rounded-full border-[3px] border-[#D1D1D6] flex items-center justify-center bg-white shadow-sm active:scale-95 transition-transform group">
<!-- Outer red circle / inner stop square -->
<span class="w-[62px] h-[62px] rounded-full bg-[#FF3B30] flex items-center justify-center transition-all duration-150 group-active:brightness-95 shadow-sm">
<!-- Iconic iOS Voice Memos stop square icon -->
<span class="w-[22px] h-[22px] bg-white rounded-sm shadow-sm"></span>
</span>
</button>
<span class="text-xs text-[#8E8E93] mt-2 font-medium tracking-tight">Ketuk untuk berhenti</span>
</div>
</div>
<!-- iOS Solid Action Button -->
<div class="w-full pt-2">
<button class="w-full bg-[#16A34A] hover:bg-[#15803D] active:scale-[0.98] transition-all text-white font-semibold text-[17px] py-4 rounded-xl shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span>Selesai Membaca</span>
</button>
</div>
</main>
<!-- iOS Home Indicator Spacing -->
<div class="w-full flex justify-center pt-3">
<div class="w-32 h-1 bg-black/20 rounded-full"></div>
</div>
</div>
</body></html>
